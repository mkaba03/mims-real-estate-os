services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: reos
      POSTGRES_USER: reos
      POSTGRES_PASSWORD: reos_dev_password
    ports: ["5432:5432"]
    volumes: ["reos_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  math-engine:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./services/math-engine:/app"]
    command: sh -c "pip install fastapi uvicorn pydantic && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  api:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/api:/app"]
    command: sh -c "npm install && npx tsx src/server.ts"
    environment:
      PORT: 4100
    ports: ["4100:4100"]
    depends_on: [postgres, redis, math-engine]
  web:
    build: .
    ports: ["5173:80"]
  temporal:
    image: temporalio/auto-setup:latest
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: reos
      POSTGRES_PWD: reos_dev_password
      POSTGRES_SEEDS: postgres

volumes:
  reos_pg:
